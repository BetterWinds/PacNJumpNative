# Builds the PlayStation Vita port (.vpk) with VitaSDK. Works on the vita branch and on tags; the vpk contains no game data.
name: Vita
on:
  push:
    branches: [vita, main]
    paths-ignore: ['web/**', 'android/**', '*.md']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vita:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Version
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then v="${{ github.ref_name }}"; else v="b${{ github.run_number }}-$(echo ${{ github.sha }} | cut -c1-7)"; fi
          echo "PNJ_VERSION=$v" >> "$GITHUB_ENV"
      - name: Build
        run: |
          export VITASDK=${VITASDK:-/usr/local/vitasdk}
          export PATH=$VITASDK/bin:$PATH
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake -DCMAKE_BUILD_TYPE=Release -DPNJ_VERSION=$PNJ_VERSION
          cmake --build build
      - uses: actions/upload-artifact@v4
        with: { name: "pacnjump-vita-${{ env.PNJ_VERSION }}", path: build/pacnjump.vpk }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [vita]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dl, merge-multiple: true }
      - name: Pick the release files
        run: |
          ls -l dl
          test "$(ls dl | wc -l)" -eq 1 || { echo "expected the vpk only"; exit 1; }
          unzip -Z1 dl/pacnjump.vpk | grep -qiE "pnj\.pack|\.apk$|\.ogg$|\.wav$|\.3gp$" && { echo "the vpk holds game data, refusing to publish"; exit 1; } || true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dl/pacnjump.vpk
