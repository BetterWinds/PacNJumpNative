# Builds the PlayStation Vita port (.vpk) with VitaSDK. Tags publish a zip with the .vpk and a txt on where to put things. No game data anywhere.
name: Vita
on:
  push:
    branches: [vita, main]
    paths-ignore: ['web/**', 'android/**', '*.md']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vita:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Version
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then v="${{ github.ref_name }}"; else v="b${{ github.run_number }}-$(echo ${{ github.sha }} | cut -c1-7)"; fi
          echo "PNJ_VERSION=$v" >> "$GITHUB_ENV"
      - name: Build
        run: |
          export VITASDK=${VITASDK:-/usr/local/vitasdk}
          export PATH=$VITASDK/bin:$PATH
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake -DCMAKE_BUILD_TYPE=Release -DPNJ_VERSION=$PNJ_VERSION
          cmake --build build
      - name: Stage the vpk and the txt
        run: |
          test -s build/pacnjump.vpk || { echo "no vpk was made"; exit 1; }
          mkdir -p out && cp build/pacnjump.vpk packaging/vita/README-Vita.txt out/
      - uses: actions/upload-artifact@v4
        with: { name: "pacnjump-vita-${{ env.PNJ_VERSION }}", path: out/ }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [vita]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dl, merge-multiple: true }
      - name: Make the release zip
        env: { TAG: '${{ github.ref_name }}' }
        run: |
          ls -l dl
          test "$(ls dl | wc -l)" -eq 2 || { echo "expected the vpk and the txt only"; exit 1; }
          test -s dl/pacnjump.vpk && test -s dl/README-Vita.txt || { echo "the vpk or the txt is missing"; exit 1; }
          unzip -Z1 dl/pacnjump.vpk | grep -qiE "pnj\.pack|\.apk$|\.ogg$|\.wav$|\.3gp$" && { echo "the vpk holds game data, refusing to publish"; exit 1; } || true
          mkdir pacnjump-vita && cp dl/pacnjump.vpk dl/README-Vita.txt pacnjump-vita/
          zip -r "PacNJump-$TAG-Vita.zip" pacnjump-vita
          unzip -l "PacNJump-$TAG-Vita.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: PacNJump-${{ github.ref_name }}-Vita.zip
