# Builds the Android app template (no game data, unsigned) and publishes web/ (the APK builder page) to GitHub Pages.
# Needs Settings > Pages > Source = "GitHub Actions". Nothing to build or commit by hand.
name: Pages
on:
  push:
    branches: [main, sdl3]
    paths: ['web/**', 'android/**', 'core/**', 'platform/**', 'third_party/**', 'CMakeLists.txt', '.github/workflows/pages.yml']
  workflow_run:                       # a new Dreamcast build means a new disc template for the Dreamcast page
    workflows: [Dreamcast]
    types: [completed]
    branches: [dreamcast]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build the template
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew -PBYO -PUNSIGNED --no-daemon assembleRelease
      - name: Copy it to web/ and check it has no game data
        run: |
          cp android/app/build/outputs/apk/release/PacNJump-byo-template-*-release.apk web/template.apk
          test "$(stat -c %s web/template.apk)" -gt 100000 || { echo "template.apk is too small, the build failed"; exit 1; }
          if unzip -l web/template.apk | grep -qE "assets/(sysparts\.png|pnj\.pack)"; then echo "template.apk contains game data, refusing to publish"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with: { name: template-apk, path: web/template.apk }
      - name: Test APK for a phone (branches other than main only)
        if: github.ref != 'refs/heads/main'
        working-directory: android
        run: ./gradlew -PBYO --no-daemon assembleDebug
      - name: Keep the test APK (no game data, pick your own APK inside the app)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with: { name: test-apk-byo, path: android/app/build/outputs/apk/debug/*.apk }
  deploy:
    needs: template
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: template-apk, path: web }
      - name: Dreamcast disc template (from the latest successful Dreamcast build, if there is one)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" -w Dreamcast -b dreamcast -s success -L 1 --json databaseId -q '.[0].databaseId' || true)
          if [ -n "$id" ]; then
            mkdir -p /tmp/dc web/dc
            gh run download "$id" -R "$GITHUB_REPOSITORY" -p 'pacnjump-dc-*' -D /tmp/dc || true
            cdi=$(find /tmp/dc -name pacnjump-dc.cdi | head -1); js=$(find /tmp/dc -name pacnjump-dc.json | head -1)
            if [ -n "$cdi" ] && [ -n "$js" ]; then cp "$cdi" web/dc/pacnjump-dc.cdi; cp "$js" web/dc/pacnjump-dc.json; ls -la web/dc; else echo "no Dreamcast template in that run"; fi
          else echo "no successful Dreamcast build yet"; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
