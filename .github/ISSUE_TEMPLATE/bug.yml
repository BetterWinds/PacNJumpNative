name: Bug report
description: Something broke or looks wrong
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, macOS, Linux, Steam Deck, Android, Other]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version
      description: Run `pacnjump --version`, or read it in the window title. On Android, say where you built the APK.
      placeholder: v0.1.1
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead. A screenshot helps.
    validations: { required: true }
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Your OS version, controller or display if it matters. Please do not attach the original APK or a pnj.pack.
